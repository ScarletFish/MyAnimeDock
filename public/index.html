<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAnimeDocker</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="btn" id="btnBack" style="display:none" onclick="goBack()">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    返回
  </button>
  <h1 id="headerTitle">MyAnimeDocker</h1>
  <div class="header-right">
    <button class="btn" id="btnDiscovery" onclick="showView('discovery')">发现</button>
    <button class="btn" id="btnLibrary" onclick="showView('library')">资料库</button>
    <button class="btn" id="btnMemories" onclick="showView('memories')">观看历史</button>
    <button class="btn" id="btnSettings" onclick="openSettings()">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>
    <button class="btn btn-danger" id="btnQuit" onclick="quitApp()">退出</button>
  </div>
</div>

<!-- Discovery View -->
<div class="view" id="discoveryView">
  <div class="view-header">
    <h2>发现动漫</h2>
    <button class="btn" onclick="refreshDiscovery()">刷新扫描</button>
  </div>
  <div class="grid-container" id="discoveryGrid"></div>
  <div class="empty-state" id="discoveryEmpty" style="display:none">
    <svg viewBox="0 0 24 24" width="64" height="64" fill="#555"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    <p>未配置媒体目录</p>
    <p>请先在设置中配置媒体目录路径</p>
  </div>
</div>

<!-- Library View -->
<div class="view hidden" id="libraryView">
  <div class="view-header">
    <h2>资料库</h2>
    <div class="view-header-right">
      <input type="text" class="search-input" id="librarySearch" placeholder="搜索..." oninput="filterLibrary()">
      <button class="btn" onclick="refreshDiscovery()">刷新</button>
    </div>
  </div>
  <div class="grid-container" id="libraryGrid"></div>
  <div class="empty-state" id="libraryEmpty" style="display:none">
    <svg viewBox="0 0 24 24" width="64" height="64" fill="#555"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
    <p>资料库为空</p>
    <p>从「发现」页面导入动漫</p>
  </div>
</div>

<!-- Memories View -->
<div class="view hidden" id="memoriesView">
  <div class="view-header">
    <h2>观看历史</h2>
  </div>
  <div class="memories-container" id="memoriesList"></div>
  <div class="empty-state" id="memoriesEmpty" style="display:none">
    <svg viewBox="0 0 24 24" width="64" height="64" fill="#555"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    <p>暂无观看记录</p>
  </div>
</div>

<!-- Anime Detail View -->
<div class="view hidden" id="detailView">
  <div class="detail-content">
    <div class="detail-header">
      <div class="detail-cover" id="detailCover"></div>
      <div class="detail-info">
        <h2 id="detailTitle"></h2>
        <div class="detail-meta">
          <span id="detailRating" class="rating-badge"></span>
          <span id="detailSeason" class="season-badge"></span>
          <span id="detailStatus" class="status-badge"></span>
        </div>
        <p id="detailSummary" class="detail-summary"></p>
        <div class="detail-actions">
          <button class="btn btn-primary" id="btnWriteMemory" onclick="openMemoryEditor()">写感想</button>
          <button class="btn btn-danger" id="btnDeleteAnime" onclick="deleteAnime()">从资料库移除</button>
        </div>
      </div>
    </div>
    <div class="detail-episodes">
      <h3>剧集列表</h3>
      <div class="episode-list" id="episodeList"></div>
    </div>
  </div>
</div>

<!-- Memory Editor Modal -->
<div class="modal-overlay" id="memoryModal">
  <div class="modal">
    <h2>写感想</h2>
    <div class="form-group">
      <label>评分 (1-10)</label>
      <input type="range" id="memoryRating" min="1" max="10" step="0.5" value="7">
      <span id="memoryRatingValue">7</span>
    </div>
    <div class="form-group">
      <label>感想</label>
      <textarea id="memoryThoughts" rows="3" placeholder="简单记录一下观感..."></textarea>
    </div>
    <div class="form-group">
      <label>详细笔记</label>
      <textarea id="memoryNotes" rows="6" placeholder="详细的观后感、印象深刻的场景、喜欢的角色..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeMemoryEditor()">取消</button>
      <button class="btn btn-primary" onclick="saveMemory()">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>设置</h2>
    <div class="form-group">
      <label>媒体目录路径</label>
      <input type="text" id="settingsMediaDir" placeholder="E:/Anime">
      <p class="form-hint">动漫文件夹所在的根目录</p>
    </div>
    <div class="form-group">
      <label>播放器模式</label>
      <select id="settingsPlayerMode">
        <option value="system">系统默认播放器</option>
        <option value="mpv">mpv 播放器</option>
      </select>
    </div>
    <div class="form-group" id="mpvPathGroup" style="display:none">
      <label>mpv 可执行文件路径</label>
      <input type="text" id="settingsMpvPath" placeholder="mpv">
    </div>
    <div id="settingsError" class="error-msg"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/discovery.js"></script>
<script src="/js/library.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/memory.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
