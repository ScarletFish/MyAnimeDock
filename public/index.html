<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAnimeDocker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark')</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="ambient-orb ambient-orb--1"></div>
<div class="ambient-orb ambient-orb--2"></div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M8 0C5.5 0 3 1.5 2 4c-.5 1.5 0 3 .5 4 .5 1 1.5 2 2 2.5S6 11.5 6 13v3h4v-3c0-1.5 1-2 1.5-2.5s1.5-1.5 2-2.5.5-2.5 0-4C13 1.5 10.5 0 8 0z"/></svg>
    </div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-btn" id="btnDiscovery" data-tip="发现" onclick="showView('discovery')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
    <button class="nav-btn active" id="btnLibrary" data-tip="资料库" onclick="showView('library')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
      </svg>
    </button>
    <button class="nav-btn" id="btnMemories" data-tip="观看历史" onclick="showView('memories')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v4l3 3"></path>
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
    </button>
  </nav>
  <div class="sidebar-bottom">
    <button class="nav-btn" id="btnSettings" data-tip="设置" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <button class="nav-btn nav-btn-danger" id="btnQuit" data-tip="退出" onclick="quitApp()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</aside>

<!-- Main Content -->
<main class="main-content">

  <!-- Discovery View -->
  <section class="view hidden" id="discoveryView">
    <div class="discovery-hero" id="discoveryHero">
      <div class="discovery-hero-bg"></div>
      <div class="discovery-hero-content">
        <div class="discovery-hero-title-wrap">
          <h2 class="discovery-hero-title">媒体目录</h2>
          <p class="discovery-hero-path" id="discoveryPath">未配置媒体目录</p>
        </div>
        <button class="btn btn-primary discovery-scan-btn" id="discoveryScanBtn" onclick="startScan()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
          </svg>
          <span id="scanBtnText">扫描目录</span>
        </button>
      </div>
    </div>

    <div class="discovery-stats" id="discoveryStats" style="display:none">
      <div class="discovery-stats-left">
        <div class="discovery-stat discovery-stat--accent">
          <span class="discovery-stat-num" id="statAnime">0</span>
          <span class="discovery-stat-label">识别为动漫</span>
        </div>
        <div class="discovery-stat">
          <span class="discovery-stat-num" id="statImported">0</span>
          <span class="discovery-stat-label">已导入</span>
        </div>
      </div>
      <div class="discovery-stats-right" id="discoveryToolbar">
        <div class="filter-group">
          <button class="filter-btn filter-btn--active" data-filter="all" onclick="setFilter('all')">全部</button>
          <button class="filter-btn" data-filter="unimported" onclick="setFilter('unimported')">未导入</button>
          <button class="filter-btn" data-filter="excluded" onclick="setFilter('excluded')">已排除</button>
        </div>
        <div class="filter-group">
          <button class="filter-btn" onclick="expandAll()">展开全部</button>
          <button class="filter-btn" onclick="collapseAll()">折叠全部</button>
        </div>
      </div>
    </div>

    <div class="discovery-actions" id="discoveryActions" style="display:none">
      <button class="btn btn-ghost" id="selectAllBtn" onclick="selectAllCandidates()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg>
        全选
      </button>
      <button class="btn btn-primary" onclick="importSelected()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        导入选中 (<span id="importCount">0</span>)
      </button>
    </div>

    <div class="discovery-grid" id="discoveryGrid"></div>

    <div class="empty-state" id="discoveryEmpty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      <p id="discoveryEmptyText">未找到媒体目录</p>
      <p class="empty-hint">请先在设置中配置媒体目录路径</p>
    </div>
  </section>

  <!-- Library View -->
  <section class="view hidden" id="libraryView">
    <div class="view-header">
      <h2>资料库</h2>
      <div class="view-header-right">
        <input type="text" class="search-input" id="librarySearch" placeholder="搜索动漫..." oninput="filterLibrary()">
        <button class="btn" id="btnSyncLibrary" onclick="syncLibrary()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          同步
        </button>
        <button class="btn" onclick="refreshDiscovery()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
          </svg>
          刷新
        </button>
      </div>
    </div>
    <div class="grid-container" id="libraryGrid"></div>
    <div class="empty-state" id="libraryEmpty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
      </svg>
      <p>资料库为空</p>
      <p style="font-size: 14px; color: var(--fg-muted)">设置媒体目录后自动导入动漫</p>
    </div>
  </section>

  <!-- Memories View -->
  <section class="view hidden" id="memoriesView">
    <div class="view-header">
      <h2>观看历史</h2>
    </div>
    <div class="memories-container" id="memoriesList"></div>
    <div class="empty-state" id="memoriesEmpty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v4l3 3"></path>
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
      <p>暂无观看记录</p>
    </div>
  </section>

  <!-- Anime Detail View -->
  <section class="view hidden" id="detailView">
    <div class="detail-content">
      <div id="headerTitle" style="display:none"></div>
      <div class="detail-layout">
        <div class="detail-left">
          <div class="detail-sidebar">
            <button class="btn-back" onclick="goBack()" title="返回资料库">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              返回
            </button>
            <div class="detail-cover-wrap" id="detailCover"></div>
            <div class="detail-info-panel">
              <h2 id="detailTitle"></h2>
              <div class="detail-meta-row">
                <span id="detailRating" class="rating-badge"></span>
                <span id="detailSeason" class="season-badge"></span>
                <span id="detailStatus" class="status-badge"></span>
              </div>
              <p id="detailSummary" class="detail-summary"></p>
              <div class="detail-actions">
                <button class="btn btn-primary" id="btnWriteMemory" onclick="openMemoryEditor()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                    <path d="m15 5 4 4"></path>
                  </svg>
                  写感想
                </button>
                <button class="btn" id="btnFetchBangumi" onclick="editBangumiMetadata()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                  编辑
                </button>
                <button class="btn btn-danger" id="btnDeleteAnime" onclick="deleteAnime()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                  </svg>
                  移除
                </button>
              </div>
              <div class="bangumi-edit-form" id="bangumiEditForm" style="display:none; margin-top: 12px;">
                <div class="form-group" style="margin-bottom: 8px;">
                  <label for="bangumiEditKeyword">搜索关键词</label>
                  <div style="display: flex; gap: 8px;">
                    <input type="text" id="bangumiEditKeyword" placeholder="输入自定义搜索词..." style="flex: 1;">
                    <button class="btn btn-primary" onclick="searchBangumiWithKeyword()" style="white-space: nowrap;">搜索</button>
                  </div>
                </div>
              </div>
              <div class="bangumi-search-results" id="bangumiSearchResults"></div>
              <div class="bangumi-search-results" id="bangumiSearchResults"></div>
            </div>
          </div>
        </div>
        <div class="detail-right">
          <!-- Module 1: Continue Watch Card -->
          <div class="watch-card" id="watchCard">
            <div class="watch-card-bg" id="watchCardBg"></div>
            <div class="watch-card-overlay"></div>
            <div class="watch-card-content">
              <div class="watch-card-info">
                <div class="watch-card-label" id="watchCardLabel"></div>
                <div class="watch-card-title" id="watchCardTitle"></div>
                <div class="watch-card-progress" id="watchCardProgressWrap">
                  <div class="watch-card-progress-bar" id="watchCardProgressBar"></div>
                </div>
              </div>
              <button class="watch-card-btn" id="watchCardBtn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <span id="watchCardBtnText"></span>
              </button>
            </div>
          </div>

          <!-- Module 2: Episode Heatmap -->
          <div class="episode-heatmap" id="episodeHeatmap">
            <div class="episode-heatmap-header">
              <h3>剧集列表</h3>
            </div>
            <div class="episode-heatmap-legend" id="heatmapLegend">
              <span class="heatmap-legend-item"><span class="heatmap-swatch unwatched"></span>未观看</span>
              <span class="heatmap-legend-item"><span class="heatmap-swatch watching"></span>观看中</span>
              <span class="heatmap-legend-item"><span class="heatmap-swatch watched"></span>已观看</span>
            </div>
            <div class="episode-heatmap-grid" id="episodeHeatmapGrid"></div>
          </div>

          <!-- Module 3: Watch Stats -->
          <div class="watch-stats" id="watchStats">
            <div class="watch-stats-header">
              <h3>观看统计</h3>
            </div>
            <div class="watch-stats-chart-wrap">
              <canvas class="watch-stats-chart" id="watchStatsChart" width="820" height="240"></canvas>
              <div class="watch-stats-empty" id="watchStatsEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
                <p>使用 mpv 播放器以启用观看统计</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- Memory Editor Modal -->
<div class="modal-overlay" id="memoryModal">
  <div class="modal">
    <h2>写感想</h2>
    <div class="form-group">
      <label for="memoryRating">评分 (1-10)</label>
      <input type="range" id="memoryRating" min="1" max="10" step="0.5" value="7">
      <span id="memoryRatingValue" style="color: var(--accent); font-weight: 600; margin-left: 8px;">7</span>
    </div>
    <div class="form-group">
      <label for="memoryThoughts">感想</label>
      <textarea id="memoryThoughts" rows="3" placeholder="简单记录一下观感..."></textarea>
    </div>
    <div class="form-group">
      <label for="memoryNotes">详细笔记</label>
      <textarea id="memoryNotes" rows="6" placeholder="详细的观后感、印象深刻的场景、喜欢的角色..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeMemoryEditor()">取消</button>
      <button class="btn btn-primary" onclick="saveMemory()">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>设置</h2>
    <div class="form-group">
      <label for="settingsMediaDir">媒体目录路径</label>
      <input type="text" id="settingsMediaDir" placeholder="E:/Anime">
      <p class="form-hint">动漫文件夹所在的根目录</p>
    </div>
    <div class="form-group">
      <label for="settingsTheme">主题</label>
      <select id="settingsTheme">
        <option value="dark">深色主题</option>
        <option value="light">浅色主题</option>
      </select>
    </div>
    <div class="form-group">
      <label for="settingsPlayerMode">播放器模式</label>
      <select id="settingsPlayerMode">
        <option value="system">系统默认播放器</option>
        <option value="mpv">mpv 播放器</option>
      </select>
    </div>
    <div class="form-group" id="mpvPathGroup" style="display:none">
      <label for="settingsMpvPath">mpv 可执行文件路径</label>
      <input type="text" id="settingsMpvPath" placeholder="mpv">
    </div>
    
    <fieldset class="settings-section">
      <legend>刮削源设置</legend>
      <div class="form-group">
        <label>TMDB API Key</label>
        <input type="password" id="settingsTmdbApiKey" placeholder="从 https://www.themoviedb.org/settings/api 获取">
        <p class="form-hint">启用 TMDB 刮削需要填入 API Key（可选）</p>
      </div>
      <div class="form-group">
        <label>Bangumi 刮削</label>
        <select id="settingsScraperBangumi">
          <option value="enabled">启用</option>
          <option value="disabled">禁用</option>
        </select>
      </div>
      <div class="form-group">
        <label>TMDB 刮削</label>
        <select id="settingsScraperTmdb">
          <option value="enabled">启用</option>
          <option value="disabled">禁用</option>
        </select>
      </div>
    </fieldset>

    <div id="settingsError" class="error-msg"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu">
  <div class="context-menu-item context-menu-danger" id="ctxDelete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"></path>
      <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
      <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
    </svg>
    移除
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/vendor/gsap/gsap.min.js"></script>
<script src="/vendor/gsap/Flip.min.js"></script>
<script src="/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/discovery.js"></script>
<script src="/js/library.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/memory.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
