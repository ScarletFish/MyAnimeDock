[package]
name = "myanimedock"
version = "0.1.2"
description = "MyAnimeDock - Local anime management library"
authors = ["ScarletFish"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.0"
log = "0.4"
env_logger = "0.11"
