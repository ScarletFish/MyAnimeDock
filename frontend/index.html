<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAnimeDock</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('theme')||'default',m=localStorage.getItem('themeMode');if(t==='dark'||t==='light'){m=t;t='default'}m=m||'dark';document.documentElement.setAttribute('data-theme',t==='default'?m:t);document.documentElement.setAttribute('data-theme-mode',m)})()</script>
<link rel="stylesheet" href="/src/css/styles.css">
<link rel="stylesheet" href="/src/css/light.css">
</head>
<body>

<!-- Title Bar / Onboarding（Svelte Chrome 挂载点，body 第一个子级） -->
<div id="chrome"></div>

<div class="body-wrapper">

<!-- Sidebar（Svelte 挂载点） -->
<div id="sidebar"></div>

<!-- Floating tooltip for sidebar -->
<div class="sidebar-tooltip" id="sidebarTooltip">
  <div class="sidebar-tooltip-arrow"></div>
  <div class="sidebar-tooltip-text" id="sidebarTooltipText"></div>
</div>

<!-- Main Content -->
<main class="main-content">

<!-- MetaMatch Modal -->

<!-- Svelte 挂载点（渐进迁移期间承载 Svelte 组件库，现有 vanilla app 继续由上方 HTML 渲染） -->
<!-- 置于 .main-content 末尾，使 Svelte 视图参与主滚动/布局 -->
<div id="app"></div>

</main>

</div> <!-- /body-wrapper -->

<!-- Keyboard shortcuts help -->
<div id="kbdHelpOverlay" class="kbd-help-overlay hidden">
  <div class="kbd-help__card">
    <h2 class="kbd-help__title" data-i18n="kbd.title">键盘快捷键</h2>
    <div class="kbd-help__grid">
      <div class="kbd-help__row"><kbd>1</kbd><span data-i18n="kbd.discovery">发现</span></div>
      <div class="kbd-help__row"><kbd>2</kbd><span data-i18n="kbd.library">动漫库</span></div>
      <div class="kbd-help__row"><kbd>3</kbd><span data-i18n="kbd.mylist">我的列表</span></div>
      <div class="kbd-help__row"><kbd>4</kbd><span data-i18n="kbd.stats">统计</span></div>
      <div class="kbd-help__row"><kbd>/</kbd><span data-i18n="common.search">搜索</span></div>
      <div class="kbd-help__row"><kbd>?</kbd><span data-i18n="kbd.help">快捷键帮助</span></div>
      <div class="kbd-help__row"><kbd>Esc</kbd><span data-i18n="kbd.closeBack">关闭弹窗 / 返回</span></div>
    </div>
    <p class="kbd-help__hint" data-i18n="kbd.clickToClose">点击任意位置关闭</p>
  </div>
</div>

<!-- Vendor scripts (loaded before ESM entry) -->
<script src="/vendor/d3/d3.min.js"></script>
<script src="/vendor/wordcloud/wordcloud2.js"></script>
<script src="/vendor/gsap/gsap.min.js"></script>
<script src="/vendor/gsap/Flip.min.js"></script>
<script src="/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="/vendor/i18next/i18next.min.js"></script>

<!-- Scripts loaded in dependency order (globals, not ESM) -->
<script type="module" src="/src/js/keyboard.js"></script>
<script type="module" src="/src/lib/tooltip.js"></script>
<script type="module" src="/src/lib/tauri-dialog.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
