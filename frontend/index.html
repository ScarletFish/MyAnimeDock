<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAnimeDock</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('theme')||'default',m=localStorage.getItem('themeMode');if(t==='dark'||t==='light'){m=t;t='default'}m=m||'dark';document.documentElement.setAttribute('data-theme',t==='default'?m:t);document.documentElement.setAttribute('data-theme-mode',m)})()</script>
<link rel="stylesheet" href="/src/css/styles.css">
<link rel="stylesheet" href="/src/css/light.css">
</head>
<body>

<!-- Title Bar -->
<div id="titlebar">
  <div class="titlebar__left">
    <span class="titlebar__brand" id="titlebarBrand">MyAnimeDock</span>
    <div class="titlebar__detail-context hidden" id="titlebarDetailContext">
      <button class="titlebar__back" id="titlebarBack">
        <svg viewBox="0 0 16 16"><polyline points="10 4 6 8 10 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="common.back">返回</span>
      </button>
    </div>
  </div>
  <div class="titlebar__search" id="titlebarSearch">
    <div class="titlebar__search-wrap">
      <svg class="titlebar__search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="m11 11 3 3"/></svg>
      <input type="text" id="globalSearchInput" placeholder="搜索…" autocomplete="off" spellcheck="false" data-i18n-attr="nav.searchPlaceholder:placeholder">
    </div>
    <div class="titlebar__search-results hidden" id="globalSearchResults"></div>
  </div>
  <div class="titlebar__controls">
    <button class="titlebar__btn" id="titlebarMinimize" data-tooltip="最小化" data-i18n-attr="nav.minimize:data-tooltip">
      <svg viewBox="0 0 14 14"><line x1="3" y1="7" x2="11" y2="7" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="titlebar__btn" id="titlebarMaximize" data-tooltip="最大化" data-i18n-attr="nav.maximize:data-tooltip">
      <svg viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="titlebar__btn titlebar__btn--close" id="titlebarClose" data-tooltip="关闭" data-i18n-attr="common.close:data-tooltip">
      <svg viewBox="0 0 14 14"><line x1="4" y1="4" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="4" x2="4" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
</div>

<div class="body-wrapper">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand" onclick="toggleThemeDock()" data-tip="主题与视觉设置" data-i18n-attr="nav.themeVisual:data-tip" role="button" tabindex="0">
    <div class="sidebar-brand-icon theme-indicator">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MyAnimeDock">
        <rect x="0" y="0" width="16" height="16" rx="3" fill="var(--accent)" stroke="var(--border)" stroke-width="0.5"/>
        <text x="8" y="13" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="12" fill="var(--bg-elevated)" text-anchor="middle">D</text>
      </svg>
    </div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-btn" id="btnDiscovery" data-tip="发现" data-i18n-attr="nav.discovery:data-tip" onclick="showView('discovery')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>
    <button class="nav-btn active" id="btnLibrary" data-tip="动漫库" data-i18n-attr="nav.library:data-tip" onclick="showView('library')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
      </svg>
    </button>
    <button class="nav-btn" id="btnMyList" data-tip="我的列表" data-i18n-attr="nav.mylist:data-tip" onclick="showView('mylist')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>
    <button class="nav-btn" id="btnStats" data-tip="统计" data-i18n-attr="nav.stats:data-tip" onclick="showView('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
      </svg>
    </button>
  </nav>
  <div class="sidebar-bottom">
    <button class="nav-btn" id="btnSettings" data-tip="设置" data-i18n-attr="common.settings:data-tip" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>
</aside>

<!-- Floating tooltip for sidebar -->
<div class="sidebar-tooltip" id="sidebarTooltip">
  <div class="sidebar-tooltip-arrow"></div>
  <div class="sidebar-tooltip-text" id="sidebarTooltipText"></div>
</div>

<!-- Theme Dock Overlay -->
<div class="theme-dock-overlay" id="themeDockOverlay" onclick="closeThemeDock()"></div>

<!-- Theme Dock -->
<div class="theme-dock" id="themeDock">
  <div class="theme-dock-inner">
    <div class="theme-dock-section">
      <span class="theme-dock-label" data-i18n="nav.themeColors">主题色系</span>
      <div class="theme-picker">
        <button class="theme-option theme-option--default" data-theme="default" onclick="selectTheme(this, 'default')" data-tooltip="默认" data-i18n-attr="common.default:data-tooltip"></button>
        <button class="theme-option theme-option--amber" data-theme="amber" onclick="selectTheme(this, 'amber')" data-tooltip="琥珀" data-i18n-attr="nav.amber:data-tooltip"></button>
        <button class="theme-option theme-option--ocean" data-theme="ocean" onclick="selectTheme(this, 'ocean')" data-tooltip="海洋" data-i18n-attr="nav.ocean:data-tooltip"></button>
        <button class="theme-option theme-option--sakura" data-theme="sakura" onclick="selectTheme(this, 'sakura')" data-tooltip="樱花" data-i18n-attr="nav.sakura:data-tooltip"></button>
        <button class="theme-option theme-option--emerald" data-theme="emerald" onclick="selectTheme(this, 'emerald')" data-tooltip="翡翠" data-i18n-attr="nav.emerald:data-tooltip"></button>
        <button class="theme-option theme-option--violet" data-theme="violet" onclick="selectTheme(this, 'violet')" data-tooltip="紫罗兰" data-i18n-attr="nav.violet:data-tooltip"></button>
      </div>
    </div>
    <div class="theme-dock-separator"></div>
    <div class="theme-dock-section">
      <div class="theme-mode-toggle mt-0">
        <span class="theme-toggle-label theme-toggle-label--active" id="dockLabelDark" data-i18n="common.dark">深色</span>
        <label class="toggle-switch">
          <input type="checkbox" id="dockThemeMode" onchange="handleDockThemeModeToggle(this)">
          <span class="toggle-slider"></span>
        </label>
        <span class="theme-toggle-label theme-toggle-label--inactive" id="dockLabelLight" data-i18n="common.light">浅色</span>
      </div>
    </div>
    <div class="theme-dock-separator"></div>
    <div class="theme-dock-section theme-dock-section--zoom">
      <span class="theme-dock-label" data-i18n="nav.zoom">缩放</span>
      <input type="range" id="dockZoom" min="75" max="125" step="5" value="100" oninput="handleDockZoom(this)">
      <span class="theme-dock-zoom-value" id="dockZoomLabel">100%</span>
    </div>
    <div class="theme-dock-separator"></div>
    <div class="theme-dock-section">
      <span class="theme-dock-label" data-i18n="nav.reduceMotion">减少动画</span>
      <label class="toggle-switch">
        <input type="checkbox" id="dockReduceMotion" onchange="handleReduceMotionToggle(this)">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
  <button class="theme-dock-close" onclick="closeThemeDock()" data-tooltip="关闭" data-i18n-attr="common.close:data-tooltip">✕</button>
</div>

<!-- Main Content -->
<main class="main-content">

<!-- MetaMatch Modal -->
<div class="modal-overlay modal-overlay--metamatch" id="metaMatchModal">
  <div class="modal modal--metamatch">
    <div class="modal-m-topbar">
      <h2 data-i18n="metamatch.title">批量元数据匹配</h2>
      <div class="modal-m-badges">
        <span class="stat-badge"><span class="num" id="mmStatTotal">0</span><span data-i18n="common.all">全部</span></span>
        <span class="stat-badge pending"><span class="num" id="mmStatPending">0</span><span data-i18n="metamatch.statusPending">待处理</span></span>
        <span class="stat-badge failed"><span class="num" id="mmStatFailed">0</span><span data-i18n="common.failed">失败</span></span>
        <span class="stat-badge matched"><span class="num" id="mmStatMatched">0</span><span data-i18n="metamatch.statusMatched">已匹配</span></span>
        <span class="stat-badge matching"><span class="num" id="mmStatMatching">0</span><span data-i18n="metamatch.statusMatching">匹配中</span></span>
      </div>
      <button class="modal-close-btn" onclick="closeModal('metaMatchModal')" aria-label="关闭" data-i18n-attr="common.close:aria-label">✕</button>
    </div>
    <div class="modal-m-progress"><div class="fill" id="mmModalProgress" style="width:0%"></div></div>
    <div class="modal-m-filterbar">
      <button class="btn btn-outline" id="mmMainActionBtn" onclick="mmMainAction()" data-i18n="metamatch.autoMatchAll">自动匹配全部</button>
      <span class="mm-shift-tip" id="mmShiftTip" style="display:none" data-i18n="metamatch.shiftMultiSelect">Shift+点击 多选</span>
      <div class="spacer"></div>
      <button class="mm-filter-dot mm-filter-dot--active" data-mmfilter="all" onclick="mmSetFilter('all')"><span class="dot dot-all"></span></button>
      <button class="mm-filter-dot" data-mmfilter="pending" onclick="mmSetFilter('pending')"><span class="dot dot-pending"></span></button>
      <button class="mm-filter-dot" data-mmfilter="failed" onclick="mmSetFilter('failed')"><span class="dot dot-failed"></span></button>
      <button class="mm-filter-dot" data-mmfilter="matched" onclick="mmSetFilter('matched')"><span class="dot dot-matched"></span></button>
      <div class="mm-list-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="mmGridSearch" placeholder="搜索条目..." oninput="mmFilterGrid()" data-i18n-attr="metamatch.searchEntry:placeholder">
      </div>
      <button class="btn btn-sm btn-ghost" id="mmCancelBtn" onclick="mmCancelSync()" style="display:none" data-i18n="common.stop">停止</button>
    </div>
    <div class="modal-m-body">
      <div class="mm-left">
        <div class="mm-list" id="mmGrid"></div>
        <div class="mm-list-empty" id="mmEmpty" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <p data-i18n="metamatch.noPendingItems">没有需要匹配的条目</p>
          <p class="empty-hint" data-i18n="metamatch.noMatchHint">所有条目已有元数据，或动漫库为空</p>
        </div>
      </div>
      <div class="mm-panel" id="mmPanel">
        <div class="mm-panel-content" id="mmPanelContent" style="display:none"></div>
        <div class="mm-panel-synclog" id="mmPanelSyncLog" style="display:none">
          <div class="mm-panel-synclog-header">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span data-i18n="metamatch.syncLog">同步日志</span>
          </div>
          <div class="mm-panel-synclog-entries" id="mmSyncLogEntries"></div>
          <div class="mm-panel-synclog-summary" id="mmSyncLogSummary" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Status Modal -->
<div class="modal-overlay" id="statusModal" onclick="if(event.target===this)closeModal('statusModal')">
  <div class="modal status-modal">
    <div class="status-modal-bg-wrap">
      <div class="status-modal-bg" id="statusModalBg"></div>
      <div class="status-modal-overlay"></div>
      <div class="status-modal-glass"></div>
    </div>
    <button class="status-modal-close" onclick="closeModal('statusModal')" aria-label="关闭" data-i18n-attr="common.close:aria-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="status-modal-inner">
      <h2 class="status-modal-heading" id="statusModalTitle" data-i18n="mylist.markStatus">标记状态</h2>
      <div class="status-modal-body">
        <div class="field-row">
          <div class="field-cell">
            <label class="field-label" data-i18n="common.status">状态</label>
            <div class="status-dd" id="statusDd">
              <button type="button" class="status-dd-trigger" id="statusDdTrigger" onclick="toggleStatusDropdown(event)">
                <span class="status-dd-text" id="statusDdText" data-i18n="common.wish">计划中</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="status-dd-chevron"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="status-dd-menu" id="statusDdMenu">
                <button type="button" class="status-dd-opt" data-value="watching" onclick="selectStatusOption(this)"><svg class="status-dd-opt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="9"/></svg><span data-i18n="common.watching">进行中</span><svg class="status-dd-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>
                <button type="button" class="status-dd-opt" data-value="wish" onclick="selectStatusOption(this)"><svg class="status-dd-opt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span data-i18n="common.wish">计划中</span><svg class="status-dd-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>
                <button type="button" class="status-dd-opt" data-value="completed" onclick="selectStatusOption(this)"><svg class="status-dd-opt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="common.completed">已完成</span><svg class="status-dd-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>
                <button type="button" class="status-dd-opt" data-value="on_hold" onclick="selectStatusOption(this)"><svg class="status-dd-opt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span data-i18n="common.on_hold">搁置</span><svg class="status-dd-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>
                <button type="button" class="status-dd-opt" data-value="dropped" onclick="selectStatusOption(this)"><svg class="status-dd-opt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span data-i18n="common.dropped">抛弃</span><svg class="status-dd-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>
              </div>
            </div>
          </div>
          <div class="field-cell">
            <label class="field-label" data-i18n="common.rating">评分</label>
            <div class="num-stepper" id="ratingStepper" data-min="0" data-max="10" data-step="0.5">
              <button type="button" class="num-stepper-btn" onclick="stepperChange(this, -0.5)">−</button>
              <span class="num-stepper-val" id="ratingDisplay" data-i18n="common.none">—</span>
              <button type="button" class="num-stepper-btn" onclick="stepperChange(this, 0.5)">+</button>
            </div>
          </div>
          <div class="field-cell">
            <label class="field-label" data-i18n="mylist.progressEpisodes">进度 (集)</label>
            <div class="num-stepper" id="progressStepper" data-min="0" data-max="999" data-step="1">
              <button type="button" class="num-stepper-btn" onclick="stepperChange(this, -1)">−</button>
              <span class="num-stepper-val" id="progressDisplay" data-i18n="common.none">—</span>
              <button type="button" class="num-stepper-btn" onclick="stepperChange(this, 1)">+</button>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field-cell">
            <label class="field-label" data-i18n="common.startDate">开始日期</label>
            <div class="date-segments" data-date="startedAt">
              <input type="text" class="date-seg date-seg--y" maxlength="4" placeholder="YYYY" inputmode="numeric" oninput="segAutoTab(this)">
              <span class="date-sep">/</span>
              <input type="text" class="date-seg date-seg--m" maxlength="2" placeholder="MM" inputmode="numeric" oninput="segAutoTab(this)">
              <span class="date-sep">/</span>
              <input type="text" class="date-seg date-seg--d" maxlength="2" placeholder="DD" inputmode="numeric">
            </div>
          </div>
          <div class="field-cell">
            <label class="field-label" data-i18n="common.endDate">结束日期</label>
            <div class="date-segments" data-date="completedAt">
              <input type="text" class="date-seg date-seg--y" maxlength="4" placeholder="YYYY" inputmode="numeric" oninput="segAutoTab(this)">
              <span class="date-sep">/</span>
              <input type="text" class="date-seg date-seg--m" maxlength="2" placeholder="MM" inputmode="numeric" oninput="segAutoTab(this)">
              <span class="date-sep">/</span>
              <input type="text" class="date-seg date-seg--d" maxlength="2" placeholder="DD" inputmode="numeric">
            </div>
          </div>
          <div class="field-cell">
            <label class="field-label" data-i18n="common.notes">笔记</label>
            <input type="text" id="notesInput" class="notes-input" placeholder="简短记录..." maxlength="200" data-i18n-attr="mylist.notesPlaceholder:placeholder">
          </div>
        </div>
      </div>
      <div class="status-modal-footer">
        <button class="btn btn-primary" onclick="saveStatusModal()" data-i18n="common.save">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Sync Metadata Modal -->
<div class="modal-overlay" id="syncModal">
  <div class="modal modal--large">
    <h2 data-i18n="detail.syncMetadata">同步元数据</h2>
    <div class="form-group">
      <label for="syncKeyword" data-i18n="detail.searchKeyword">搜索关键词</label>
      <div class="flex gap-2">
        <input type="text" id="syncKeyword" placeholder="输入搜索词..." class="flex-1 min-w-0" data-i18n-attr="detail.searchPlaceholder:placeholder">
        <button class="btn btn-primary" onclick="searchBangumiWithKeyword()" data-i18n="common.search">搜索</button>
      </div>
    </div>
    <div class="bangumi-search-results" id="syncSearchResults"></div>
    <button class="modal-close-btn" onclick="closeModal('syncModal')">✕</button>
  </div>
</div>


<!-- Svelte 挂载点（渐进迁移期间承载 Svelte 组件库，现有 vanilla app 继续由上方 HTML 渲染） -->
<!-- 置于 .main-content 末尾，使 Svelte 视图参与主滚动/布局 -->
<div id="app"></div>

</main>

</div> <!-- /body-wrapper -->

<!-- Context Menu -->
<div class="context-menu" id="contextMenu">
  <div class="context-menu-item context-menu-danger" id="ctxDelete" data-i18n="common.remove">移除</div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer" role="alert" aria-live="polite"></div>

<!-- Onboarding overlay -->
<div id="onboardingOverlay" class="onboarding-overlay hidden">
  <div class="onboarding__card">
    <div class="onboarding__header">
      <svg class="onboarding__icon" viewBox="0 0 48 48" fill="none">
        <rect x="8" y="12" width="32" height="28" rx="4" stroke="currentColor" stroke-width="2"/>
        <circle cx="24" cy="28" r="6" stroke="currentColor" stroke-width="2"/>
        <path d="M24 16V22M24 34V40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 30L20 28M28 28L32 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M14 12V8H34V12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <h1 class="onboarding__title" data-i18n="onboarding.welcome">欢迎使用 MyAnimeDock</h1>
      <p class="onboarding__desc" data-i18n="onboarding.desc">自托管动漫媒体库管理器。智能扫描文件夹、自动匹配 Bangumi 元数据、mpv 直接播放并追踪进度。</p>
    </div>
    <div class="onboarding__body">
      <div class="onb-field" id="onbDirGroup">
        <label class="onb-field__label" data-i18n="onboarding.mediaDir">媒体目录</label>
        <div class="onb-field__row">
          <input type="text" class="onb-field__input" id="onbMediaDir" placeholder="选择动漫文件夹..." autocomplete="off" spellcheck="false" data-i18n-attr="onboarding.mediaDirPlaceholder:placeholder">
          <button class="onb-field__browse" id="onbBrowseDir" data-i18n="common.browse">浏览</button>
        </div>
        <div class="onb-field__foot">
          <a href="#" class="onb-field__skip" id="onbSkipDir" data-i18n="onboarding.skipForNow">暂时跳过</a>
        </div>
      </div>
      <div class="onb-field" id="onbMpvGroup">
        <label class="onb-field__label"><span data-i18n="onboarding.mpvPlayer">mpv 播放器</span><span class="onb-field__optional" data-i18n="common.optional">（可选）</span></label>
        <div class="onb-field__row">
          <input type="text" class="onb-field__input" id="onbMpvPath" placeholder="留空使用系统 PATH 中的 mpv" autocomplete="off" spellcheck="false" data-i18n-attr="onboarding.mpvPlaceholder:placeholder">
          <button class="onb-field__browse" id="onbBrowseMpv" data-i18n="common.browse">浏览</button>
        </div>
        <div class="onb-field__foot">
          <a href="#" class="onb-field__skip" id="onbSkipMpv" data-i18n="onboarding.skipForNow">暂时跳过</a>
        </div>
      </div>
      <div class="onb-error hidden" id="onbError"></div>
      <button class="onb-submit" id="onbStart" data-i18n="onboarding.start">开始使用</button>
    </div>
  </div>
</div>

<!-- Keyboard shortcuts help -->
<div id="kbdHelpOverlay" class="kbd-help-overlay hidden">
  <div class="kbd-help__card">
    <h2 class="kbd-help__title" data-i18n="kbd.title">键盘快捷键</h2>
    <div class="kbd-help__grid">
      <div class="kbd-help__row"><kbd>1</kbd><span data-i18n="kbd.discovery">发现</span></div>
      <div class="kbd-help__row"><kbd>2</kbd><span data-i18n="kbd.library">动漫库</span></div>
      <div class="kbd-help__row"><kbd>3</kbd><span data-i18n="kbd.mylist">我的列表</span></div>
      <div class="kbd-help__row"><kbd>4</kbd><span data-i18n="kbd.stats">统计</span></div>
      <div class="kbd-help__row"><kbd>/</kbd><span data-i18n="common.search">搜索</span></div>
      <div class="kbd-help__row"><kbd>?</kbd><span data-i18n="kbd.help">快捷键帮助</span></div>
      <div class="kbd-help__row"><kbd>Esc</kbd><span data-i18n="kbd.closeBack">关闭弹窗 / 返回</span></div>
    </div>
    <p class="kbd-help__hint" data-i18n="kbd.clickToClose">点击任意位置关闭</p>
  </div>
</div>

<!-- Vendor scripts (loaded before ESM entry) -->
<script src="/vendor/d3/d3.min.js"></script>
<script src="/vendor/wordcloud/wordcloud2.js"></script>
<script src="/vendor/gsap/gsap.min.js"></script>
<script src="/vendor/gsap/Flip.min.js"></script>
<script src="/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="/vendor/i18next/i18next.min.js"></script>

<!-- Scripts loaded in dependency order (globals, not ESM) -->
<script src="/src/js/i18n-zh.js"></script>
<script src="/src/js/i18n.js"></script>
<script src="/src/js/tag-data.js"></script>
<script src="/src/js/state.js"></script>
<script src="/src/js/debug.js"></script>
<script src="/src/js/ui.js"></script>
<script src="/src/js/api.js"></script>
<script src="/src/js/utils.js"></script>
<script src="/src/js/metamatch.js"></script>
<script src="/src/js/titlebar.js"></script>
<script src="/src/js/toast.js"></script>
<script src="/src/js/theme.js"></script>
<script src="/src/js/dashboard-layout.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/search.js"></script>
<script src="/src/js/onboarding.js"></script>
<script src="/src/js/keyboard.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
